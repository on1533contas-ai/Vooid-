<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050307">
<title>VOID — Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#39005a 0,transparent 42%),#050307;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(100%,480px)}header{text-align:center;margin-bottom:42px}h1{font-size:48px;margin:0;font-weight:900;letter-spacing:.03em}h1 span{color:#a020ff}header p{font-size:11px;letter-spacing:.4em;color:#81768a}
.card{border:1px solid #8d1ce0;border-radius:28px;padding:30px 22px;background:#0d0912;box-shadow:0 0 28px #8b00ff26}h2{text-align:center;color:#bdb3c6;font-size:20px;margin:0 0 30px}
label{display:block;color:#aaa;font-size:13px;font-weight:800;margin-bottom:12px;letter-spacing:.08em}input{width:100%;height:60px;border:1px solid #51485a;border-radius:15px;background:#111;color:#fff;padding:0 15px;font-size:16px}
button{width:100%;height:60px;margin-top:18px;border:0;border-radius:15px;background:linear-gradient(100deg,#a000ff,#6500bd);color:white;font-size:16px;font-weight:900;letter-spacing:.04em}
.note{text-align:center;color:#93899c;font-size:14px;line-height:1.6;margin-top:18px}footer{text-align:center;color:#5b5263;font-size:10px;letter-spacing:.3em;margin-top:50px}
</style></head>
<body><main>
<header><h1>VOID <span>ACCESS</span></h1><p>ACESSO EMPRESARIAL</p></header>
<section class="card">
<h2>Vincule sua chave</h2>
<form action="dashboard.html" method="get">
<label for="key">CHAVE DE ACESSO</label>
<input id="key" name="key" type="text" placeholder="Digite sua chave de acesso" required autocomplete="off">
<button type="submit">VINCULAR CHAVE</button>
</form>
<p class="note">Digite sua chave para continuar ao painel demonstrativo.</p>
</section>
<footer>VOID ACCESS © 2026</footer>
</main></body></html>
